server:
  port: 8084

spring:
  application:
    name: search-service
  config:
    import: configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  cloud:
    config:
      fail-fast: true
      retry:
        max-attempts: 20
        initial-interval: 1000
        multiplier: 1.5
        max-interval: 10000

management:
  endpoints:
    web:
      exposure:
        include: health,info
