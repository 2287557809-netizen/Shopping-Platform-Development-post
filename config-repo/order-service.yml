spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/orderdb}
    username: ${SPRING_DATASOURCE_USERNAME:order}
    password: ${SPRING_DATASOURCE_PASSWORD:order-pw}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  cloud:
    function:
      definition: inventoryEvents
    stream:
      bindings:
        orderEvents-out-0:
          destination: order-events
          content-type: text/plain
        inventoryEvents-in-0:
          destination: inventory-events
          group: order-service
          content-type: text/plain
      kafka:
        bindings:
          orderEvents-out-0:
            producer:
              configuration:
                key.serializer: org.apache.kafka.common.serialization.StringSerializer
          inventoryEvents-in-0:
            consumer:
              auto-offset-reset: earliest
    openfeign:
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 5000
            logger-level: basic
