spring:
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      password: ${SPRING_REDIS_PASSWORD:mypass}
      timeout: 2s
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 5000
            logger-level: basic

cart:
  # Step 4, task 3: carts expire, the period is documented in the README.
  # Seconds; 1800 = 30 minutes, refreshed on every write.
  time-to-live-seconds: 1800
